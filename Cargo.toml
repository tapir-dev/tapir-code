[package]
name = "tapir-code"
version = "0.1.0"
edition = "2024"
license = "ISC"
description = "tapir coding agent"

[[bin]]
name = "tp"
path = "src/main.rs"

[lib]
name = "tapir_code"
path = "src/lib.rs"

[dependencies]
tapir = { path = "../tapir/tapir", features = ["anthropic", "openai"] }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "io-util",
    "time",
] }
futures-util = "0.3"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
libc = "0.2"

[dev-dependencies]
async-trait = "0.1"
